<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaimIt</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="../../assets/icon-48.png" alt="ClaimIt" class="brand-icon" />
        <div>
          <h1 class="brand-title">ClaimIt</h1>
          <p class="last-checked" id="lastCheckedText">Last checked: Never</p>
        </div>
      </div>
      <div class="header-actions">
        <label class="pause-pill" title="Pause or resume all automation immediately">
          <input type="checkbox" id="pauseSwitch" />
          <span class="pause-track"></span>
          <span class="pause-label" id="pauseLabel">Active</span>
        </label>
        <button id="openOptionsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="banners" id="banners">
        <span class="chip chip-warn hidden" id="dryRunBadge">Dry-run</span>
        <span class="chip chip-muted hidden" id="pausedBadge">Paused</span>
      </div>
      <button id="checkNowBtn" class="btn btn-primary">Check now</button>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="free" role="tab" aria-selected="true">
        Free now <span class="tab-count" id="freeCount">0</span>
      </button>
      <button class="tab" data-tab="claimed" role="tab" aria-selected="false">
        Claimed <span class="tab-count" id="claimedCount">0</span>
      </button>
      <button class="tab" data-tab="issues" role="tab" aria-selected="false">
        Issues <span class="tab-count" id="issuesCount">0</span>
      </button>
    </nav>

    <main class="content">
      <section id="tab-free" class="tab-panel active"></section>
      <section id="tab-claimed" class="tab-panel"></section>
      <section id="tab-issues" class="tab-panel"></section>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
