<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaimIt</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <img src="../../assets/wordmark.svg" alt="ClaimIt" width="108" height="22" class="wordmark" />
        <span class="badge badge-needs hidden" id="dryRunBadge">
          <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-shield"></use></svg>
          <span>Dry-run</span>
        </span>
      </div>
      <div class="header-actions">
        <button id="pauseBtn" type="button" class="btn btn-pause" role="switch" aria-checked="false" aria-label="Pause automation">
          <svg id="pauseBtnIcon" class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-pause"></use></svg>
          <span id="pauseBtnLabel">Pause</span>
        </button>
        <button id="openOptionsBtn" type="button" class="icon-btn" aria-label="Open settings" title="Settings">
          <svg class="icon icon-md" aria-hidden="true"><use href="../../assets/icons.svg#icon-settings"></use></svg>
        </button>
      </div>
    </header>

    <div class="status-bar">
      <p class="status-line tabular" id="statusLine" aria-live="polite">Loading status…</p>
      <button id="checkNowBtn" type="button" class="btn btn-primary">
        <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-refresh"></use></svg>
        <span id="checkNowLabel">Check now</span>
      </button>
    </div>

    <div class="accounts-bar" id="accountsBar" aria-label="Store accounts"></div>

    <nav class="tabs" role="tablist" aria-label="Offers and history">
      <button id="tabBtn-free" type="button" class="tab active" data-tab="free" role="tab" aria-selected="true" aria-controls="tab-free">
        <span>Free now</span>
        <span class="tab-count tabular" id="freeCount">0</span>
      </button>
      <button id="tabBtn-deals" type="button" class="tab" data-tab="deals" role="tab" aria-selected="false" aria-controls="tab-deals" tabindex="-1">
        <span>Deals</span>
        <span class="tab-count tabular" id="dealsCount">0</span>
      </button>
      <button id="tabBtn-free-steam" type="button" class="tab" data-tab="free-steam" role="tab" aria-selected="false" aria-controls="tab-free-steam" tabindex="-1" title="All free Steam games">
        <span>Free Steam</span>
        <span class="tab-count tabular" id="freeSteamCount">0</span>
      </button>
      <button id="tabBtn-claimed" type="button" class="tab" data-tab="claimed" role="tab" aria-selected="false" aria-controls="tab-claimed" tabindex="-1">
        <span>Claimed</span>
        <span class="tab-count tabular" id="claimedCount">0</span>
      </button>
      <button id="tabBtn-issues" type="button" class="tab" data-tab="issues" role="tab" aria-selected="false" aria-controls="tab-issues" tabindex="-1">
        <span>Issues</span>
        <span class="tab-count tabular" id="issuesCount">0</span>
      </button>
    </nav>

    <main class="content">
      <section id="tab-free" class="tab-panel active" role="tabpanel" aria-labelledby="tabBtn-free"></section>
      <section id="tab-deals" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-deals" hidden>
        <div class="deals-bar">
          <div class="deals-controls-row">
            <div class="search-field">
              <svg class="icon search-icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-search"></use></svg>
              <input id="dealsSearchInput" type="text" class="search-input" placeholder="Search deals (e.g. Battlefield)" aria-label="Search Steam deals" autocomplete="off" spellcheck="false" maxlength="80" />
              <button id="clearDealsSearchBtn" type="button" class="search-clear-btn hidden" aria-label="Clear search" title="Clear search">
                <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-close"></use></svg>
              </button>
            </div>
            <select id="dealsSortSelect" class="select-compact" aria-label="Sort Steam deals">
              <option value="popular">Top sellers</option>
              <option value="reviews">Most reviewed</option>
              <option value="discount">Highest % off</option>
              <option value="price">Lowest price</option>
            </select>
          </div>
          <div class="deals-bar-top">
            <label for="dealsDiscountSlider" class="deals-bar-label">Min discount</label>
            <div class="deals-bar-actions">
              <span id="dealsDiscountValue" class="badge badge-claimed tabular">75%+</span>
              <button id="refreshDealsBtn" type="button" class="icon-btn icon-btn-sm" aria-label="Refresh Steam deals" title="Show next batch of Steam deals">
                <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-refresh"></use></svg>
              </button>
            </div>
          </div>
          <input id="dealsDiscountSlider" type="range" min="40" max="100" step="1" value="75" class="discount-slider" />
          <div class="deals-scale tabular">
            <span>40%</span>
            <span>70%</span>
            <span>100% (Free only)</span>
          </div>
          <p class="deals-hint" id="dealsHint">Top Steam sales (40-99%) open on Steam and are never auto-bought.</p>
        </div>
        <div id="dealsListContainer"></div>
      </section>
      <section id="tab-free-steam" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-free-steam" hidden>
        <div class="deals-bar">
          <div class="deals-controls-row">
            <div class="search-field">
              <svg class="icon search-icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-search"></use></svg>
              <input id="freeSteamSearchInput" type="text" class="search-input" placeholder="Search free games (e.g. Apex)" aria-label="Search free Steam games" autocomplete="off" spellcheck="false" maxlength="80" />
              <button id="clearFreeSteamSearchBtn" type="button" class="search-clear-btn hidden" aria-label="Clear search" title="Clear search">
                <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-close"></use></svg>
              </button>
            </div>
            <select id="freeSteamSortSelect" class="select-compact" aria-label="Sort free Steam games">
              <option value="popular">Popular</option>
              <option value="reviews">Most reviewed</option>
              <option value="rating">Highest rated</option>
            </select>
          </div>
          <div class="deals-bar-top">
            <p class="deals-hint" id="freeSteamHint">All free-to-play and 100%-off games on Steam.</p>
            <button id="refreshFreeSteamBtn" type="button" class="icon-btn icon-btn-sm" aria-label="Refresh free Steam games" title="Show next batch of free Steam games">
              <svg class="icon" aria-hidden="true"><use href="../../assets/icons.svg#icon-refresh"></use></svg>
            </button>
          </div>
        </div>
        <div id="freeSteamListContainer"></div>
      </section>
      <section id="tab-claimed" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-claimed" hidden></section>
      <section id="tab-issues" class="tab-panel" role="tabpanel" aria-labelledby="tabBtn-issues" hidden></section>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
